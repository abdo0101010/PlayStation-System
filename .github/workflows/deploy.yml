name: Deploy to MonsterASP via FTP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish App
      run: |
        dotnet publish -c Release -o ./publish-output /p:DebugType=None /p:DebugSymbols=false

    - name: Sync Files via FTP (Fast Incremental Sync)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish-output/
        server-dir: ./
        dangerous-clean-slate: false # رفع التعديلات فقط بدلاً من إعادة الرفع من الصفر
        dry-run: false
        exclude: |
          **/.git*
          **/.git*/**
          **/appsettings.json
          **/appsettings.Development.json
